<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Shopping Page</title>

<style>
/* Element Selector */
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    margin: 0;
    padding: 0;
}

/* ID Selector */
#header {
    background: #02fc41;
    color: white;
    text-align: center;
    padding: 20px;
}

/* Class Selector */
.container {
    display: grid;
    grid-template-columns: repeat(3, 220px);
    justify-content: center;
    gap: 20px;
    margin: 30px;
}

.product {
    background: white;
    width: 220px;
    padding: 15px;
    border-radius: 8px;
    text-align: center;
    box-shadow: 0 0 10px gray;
}

/* Descendant Selector */
.product h2 {
    color: #333;
}

/* Class Selector */
.price {
    color: green;
    font-size: 20px;
    font-weight: bold;
}

/* Element Selector */
button {
    background: orange;
    color: white;
    border: none;
    padding: 10px 15px;
    border-radius: 5px;
    cursor: pointer;
}

/* Pseudo-class Selector */
button:hover {
    background: darkorange;
}

/* Descendant Selector */
.product img {
    width: 150px;
    height: 150px;
}
</style>

</head>
<body>

<header id="header">
    <h1>Online Shopping Store</h1>
</header>

<div class="container">

  
    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ1zc86eb8oIu4eOwyIRNcCoPuxNAWf-W1EHw9y5Ro0ew&s=10" alt="Headphones">
        <h2>Wireless Headphones</h2>
        <p class="price">₹1,999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcROfU8wcXzEAd2bwyAeEHZ-VcpgwvyIQyS9_aWyZB7tO_VKxGYQ5BmstlO43m4qV-rSGBawjl3cjng83d-jQ5Ao3x4ASMmaCcEWEIBvN6F3gKmPoWKZVFI0&usqp=CAc" alt="Watch">
        <h2>Smart Watch</h2>
        <p class="price">₹2,499</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRuqGc0Z43dtsQgjV5-uRHKxQbbMTbYIV7wQvoeoTwLfw&s=10" alt="Shoes">
        <h2>Sports Shoes</h2>
        <p class="price">₹3,299</p>
        <button>Buy Now</button>
    </div>


    <!-- Row 2 -->
    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSzbOXa_WzmUsw6v1OztbBRzTrBv_-02bPIAXewpVuEiQ&s" alt="Laptop">
        <h2>Laptop</h2>
        <p class="price">₹45,999</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvD9jlvU3rGhus-hZAOyjflbV3Q-_wafAZ4332BCYyug&s=10" alt="Speaker">
        <h2>Bluetooth Speaker</h2>
        <p class="price">₹1,499</p>
        <button>Buy Now</button>
    </div>

    <div class="product">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTbfxek5sLnU9wv62oMK_ZY9ARwFIVi85jRVfld4QVtTg&s=10" alt="Backpack">
        <h2>Travel Backpack</h2>
        <p class="price">₹999</p>
        <button>Buy Now</button>
    </div>

</div>

</body>
</html>

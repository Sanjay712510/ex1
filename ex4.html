<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eco-Tech Global - Sustainable Careers</title>
  <style>
    /* Eco-Green Nature Tech Theme */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #f3f4f0;
      color: #1c2e24;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Organic Top Bar */
    header {
      background: #1c2e24;
      padding: 1rem 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(28, 46, 36, 0.15);
    }

    .brand-logo {
      font-size: 1.4rem;
      font-weight: 800;
      color: #81c784;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-actions button {
      padding: 0.6rem 1.4rem;
      margin-left: 10px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-leaf-outline {
      background: transparent;
      color: #81c784;
      border: 1.5px solid #81c784;
    }

    .btn-leaf-outline:hover {
      background: rgba(129, 199, 132, 0.15);
    }

    .btn-leaf-solid {
      background: #2e7d32;
      color: #ffffff;
      border: none;
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
    }

    .btn-leaf-solid:hover {
      background: #388e3c;
      transform: translateY(-2px);
    }

    /* Container Grid */
    .container {
      flex: 1;
      max-width: 1150px;
      width: 100%;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 25px;
    }

    @media (max-width: 850px) {
      .container {
        grid-template-columns: 1fr;
      }
    }

    /* Hero Sidebar Card */
    .hero-panel {
      background: linear-gradient(145deg, #1c2e24, #2d4a3b);
      color: #ffffff;
      padding: 35px 25px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .hero-panel h1 {
      font-size: 2rem;
      line-height: 1.2;
      color: #81c784;
      margin-bottom: 15px;
    }

    .hero-panel p {
      color: #c8e6c9;
      font-size: 0.95rem;
      line-height: 1.6;
    }

    .badge-group {
      margin-top: 25px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .eco-badge {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(129, 199, 132, 0.3);
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 0.85rem;
      color: #e8f5e9;
    }

    /* Main Content Area */
    .main-panel {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .eco-card {
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      border: 1px solid #e0e6ed;
      box-shadow: 0 5px 15px rgba(0,0,0,0.03);
    }

    .eco-card h3 {
      color: #1c2e24;
      font-size: 1.2rem;
      margin-bottom: 18px;
      border-left: 4px solid #2e7d32;
      padding-left: 10px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #e8f5e9;
      color: #1b5e20;
      padding: 12px;
      text-align: left;
      font-size: 0.8rem;
      text-transform: uppercase;
      font-weight: 700;
      border-radius: 6px;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #f0f4f1;
      font-size: 0.9rem;
      color: #37474f;
    }

    /* Modal Overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(28, 46, 36, 0.7);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .eco-modal {
      background: #ffffff;
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 520px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.5rem;
      color: #888;
      cursor: pointer;
    }

    .eco-modal h2 {
      color: #1b5e20;
      margin-bottom: 20px;
      font-size: 1.4rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group.full {
      grid-column: span 2;
    }

    .form-group label {
      font-size: 0.8rem;
      color: #2e7d32;
      margin-bottom: 5px;
      font-weight: 700;
    }

    .form-group input, .form-group select {
      background: #f9fbf9;
      border: 1px solid #c8e6c9;
      padding: 10px;
      border-radius: 10px;
      color: #1c2e24;
      font-size: 0.88rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: #2e7d32;
      background: #ffffff;
    }

    .btn-submit {
      grid-column: span 2;
      background: #2e7d32;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background: #1b5e20;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      color: #666;
      background: #ffffff;
      border-top: 1px solid #e0e6ed;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- Top Navigation -->
  <header>
    <div class="brand-logo">🌱 Eco-Tech Solutions</div>
    <div class="nav-actions">
      <button class="btn-leaf-outline" onclick="toggleModal('signinModal', true)">Sign In</button>
      <button class="btn-leaf-solid" onclick="toggleModal('registerModal', true)">Apply Now</button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="container">
    
    <!-- Left Hero Sidebar -->
    <div class="hero-panel">
      <div>
        <h1>Build a Sustainable Future</h1>
        <p>Join our green-tech network and submit your profile for upcoming eco-friendly digital initiatives.</p>
      </div>
      <div class="badge-group">
        <div class="eco-badge">✔ 100% Digital Hiring Workflow</div>
        <div class="eco-badge">✔ Verified Talent Network</div>
      </div>
    </div>

    <!-- Right Data Panel -->
  

  

  <!-- Sign In Modal -->
  <div class="modal-overlay" id="signinModal">
    <div class="eco-modal" style="max-width: 380px;">
      <span class="close-btn" onclick="toggleModal('signinModal', false)">&times;</span>
      <h2>Portal Sign In</h2>
      <form onsubmit="return handleSignIn(event)">
        <div class="form-group full" style="margin-bottom: 12px;">
          <label>Email Address *</label>
          <input type="text" id="signInEmail" placeholder="candidate@ecotech.com">
        </div>
        <div class="form-group full" style="margin-bottom: 12px;">
          <label>Password *</label>
          <input type="password" id="signInPass" placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Login</button>
      </form>
    </div>
  </div>

  <!-- Registration Modal (8 Fields) -->
  <div class="modal-overlay" id="registerModal">
    <div class="eco-modal">
      <span class="close-btn" onclick="toggleModal('registerModal', false)">&times;</span>
      <h2>Application Form</h2>
      <form id="regForm" onsubmit="return handleRegister(event)">
        <div class="form-grid">
          
          <div class="form-group">
            <label>Full Name *</label>
            <input type="text" id="fullname" placeholder="Eco Candidate">
          </div>

          <div class="form-group">
            <label>Email Address *</label>
            <input type="text" id="email" placeholder="user@gmail.com">
          </div>

          <div class="form-group">
            <label>Phone Number *</label>
            <input type="text" id="phone" placeholder="10-digit number">
          </div>

          <div class="form-group">
            <label>Qualification *</label>
            <select id="qualification">
              <option value="">Select Degree</option>
              <option value="B.E / B.Tech">B.E / B.Tech</option>
              <option value="B.Sc / M.Sc">B.Sc / M.Sc</option>
              <option value="BCA / MCA">BCA / MCA</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label>Experience (Years) *</label>
            <input type="number" id="experience" placeholder="e.g. 1" min="0">
          </div>

          <div class="form-group">
            <label>Location *</label>
            <input type="text" id="location" placeholder="e.g. Madurai">
          </div>

          <div class="form-group full">
            <label>Password *</label>
            <input type="password" id="password" placeholder="At least 6 characters">
          </div>

          <div class="form-group full">
            <label>Upload Resume (.pdf / .doc / .docx) *</label>
            <input type="file" id="resume" accept=".pdf,.doc,.docx">
          </div>

          <button type="submit" class="btn-submit">Submit Profile</button>

        </div>
      </form>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy; 2026 Eco-Tech Solutions. Sustainable Code Network.
  </footer>

  <!-- Script Logic -->
  <script>
    document.addEventListener("DOMContentLoaded", loadApplicants);

    function toggleModal(id, show) {
      document.getElementById(id).style.display = show ? 'flex' : 'none';
    }

    function loadApplicants() {
  let tbody = document.getElementById("applicantTableBody");
  tbody.innerHTML = `
    <tr>
      <td colspan="5" style="text-align:center; color:#888;">
        Candidate submissions are not stored.
      </td>
    </tr>
  `;
}

    function handleRegister(event) {
      event.preventDefault();

      let fullName = document.getElementById("fullname").value.trim();
      let email = document.getElementById("email").value.trim();
      let phone = document.getElementById("phone").value.trim();
      let qualification = document.getElementById("qualification").value;
      let experience = document.getElementById("experience").value.trim();
      let location = document.getElementById("location").value.trim();
      let password = document.getElementById("password").value;
      let resume = document.getElementById("resume").value;

      // 1. Mandatory Check
      if (!fullName || !email || !phone || !qualification || !experience || !location || !password) {
        alert("Please fill in all mandatory fields!");
        return false;
      }
      // Full Name Validation
if (!/^[A-Za-z\s]+$/.test(fullName)) {
  alert("Full Name should contain only alphabets and spaces!");
  return false;
}

      // 2. Syllabus Regex
      if (!email.match(/^[^\s@]+@[^\s@]+\.[a-z]{2,3}$/)) {
        alert("Invalid email");
        return false;
      }

      if (!phone.match(/^\d{10}$/)) {
        alert("Please enter a valid 10-digit phone number!");
        return false;
      }

      if (password.length < 6) {
        alert("Password must be at least 6 characters long!");
        return false;
      }

      // 3. Resume Extension Check
      if (!resume || !resume.match(/\.(pdf|doc|docx)$/i)) {
        alert("Only PDF/DOC/DOCX allowed");
        return false;
      }

      alert("Application Submitted Successfully!");
toggleModal('registerModal', false);
document.getElementById("regForm").reset();
return true;
      alert("Application Submitted Successfully!");
      toggleModal('registerModal', false);
      document.getElementById("regForm").reset();

      loadApplicants();
      return true;
    }

    function handleSignIn(event) {
  event.preventDefault();

  let email = document.getElementById("signInEmail").value.trim();
  let pass = document.getElementById("signInPass").value;

  if (!email || !pass) {
    alert("Please enter both email and password!");
    return false;
  }

  alert("Login feature is disabled. No user data is stored.");
  return false;
}
  </script>
</body>
</html>
